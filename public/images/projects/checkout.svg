<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-label="Fast checkout screen mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe3d4"/>
      <stop offset="1" stop-color="#fdf8f5"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="640" height="480" fill="url(#bg)"/>
  <circle cx="566" cy="76" r="120" fill="#dcefe4" opacity="0.5"/>
  <circle cx="66" cy="420" r="110" fill="#e4def3" opacity="0.55"/>

  <!-- Window -->
  <rect x="78" y="86" width="500" height="340" rx="18" fill="#4a4653" opacity="0.1"/>
  <rect x="70" y="72" width="500" height="340" rx="18" fill="#fffdfc"/>
  <path d="M70 90a18 18 0 0 1 18-18h464a18 18 0 0 1 18 18v24H70Z" fill="#f8efe9"/>
  <circle cx="96" cy="93" r="5.5" fill="#ff5f57"/>
  <circle cx="116" cy="93" r="5.5" fill="#febc2e"/>
  <circle cx="136" cy="93" r="5.5" fill="#28c840"/>
  <line x1="70" y1="114" x2="570" y2="114" stroke="rgba(74,70,83,0.12)"/>

  <!-- Product rows -->
  <circle cx="122" cy="154" r="14" fill="#dcefe4"/>
  <rect x="150" y="149" width="190" height="9" rx="4.5" fill="#ececf1"/>
  <rect x="470" y="149" width="58" height="9" rx="4.5" fill="#e4def3"/>

  <circle cx="122" cy="208" r="14" fill="#dbeaf5"/>
  <rect x="150" y="203" width="230" height="9" rx="4.5" fill="#ececf1"/>
  <rect x="470" y="203" width="58" height="9" rx="4.5" fill="#e4def3"/>

  <circle cx="122" cy="262" r="14" fill="#f6e3e6"/>
  <rect x="150" y="257" width="160" height="9" rx="4.5" fill="#ececf1"/>
  <rect x="470" y="257" width="58" height="9" rx="4.5" fill="#e4def3"/>

  <!-- Dividers -->
  <line x1="104" y1="184" x2="536" y2="184" stroke="rgba(74,70,83,0.1)"/>
  <line x1="104" y1="238" x2="536" y2="238" stroke="rgba(74,70,83,0.1)"/>
  <line x1="104" y1="292" x2="536" y2="292" stroke="rgba(74,70,83,0.1)"/>

  <!-- Total -->
  <rect x="104" y="308" width="110" height="11" rx="5.5" fill="#4a4653" opacity="0.8"/>
  <rect x="468" y="305" width="66" height="14" rx="7" fill="#8a5e73"/>

  <!-- Pay button -->
  <rect x="104" y="344" width="432" height="40" rx="20" fill="#8a5e73"/>
  <rect x="276" y="360" width="86" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="508" cy="364" r="12" fill="#ffffff" opacity="0.3"/>
</svg>
