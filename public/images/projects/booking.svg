<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-label="Calendar booking flow app mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcefe4"/>
      <stop offset="1" stop-color="#fdf8f5"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="640" height="480" fill="url(#bg)"/>
  <circle cx="560" cy="56" r="130" fill="#e4def3" opacity="0.5"/>
  <circle cx="58" cy="446" r="110" fill="#f6e3e6" opacity="0.6"/>

  <!-- Window -->
  <rect x="78" y="86" width="500" height="340" rx="18" fill="#4a4653" opacity="0.1"/>
  <rect x="70" y="72" width="500" height="340" rx="18" fill="#fffdfc"/>
  <path d="M70 90a18 18 0 0 1 18-18h464a18 18 0 0 1 18 18v24H70Z" fill="#f8efe9"/>
  <circle cx="96" cy="93" r="5.5" fill="#ff5f57"/>
  <circle cx="116" cy="93" r="5.5" fill="#febc2e"/>
  <circle cx="136" cy="93" r="5.5" fill="#28c840"/>
  <line x1="70" y1="114" x2="570" y2="114" stroke="rgba(74,70,83,0.12)"/>

