  <circle cx="516" cy="134" r="9" fill="#f6e3e6"/>
  <circle cx="542" cy="134" r="9" fill="#dcefe4"/>

  <!-- Calendar grid -->
  <g fill="#fdf8f5" stroke="rgba(74,70,83,0.09)">
    <rect x="104" y="152" width="52" height="40" rx="8"/><rect x="166" y="152" width="52" height="40" rx="8"/><rect x="228" y="152" width="52" height="40" rx="8"/><rect x="290" y="152" width="52" height="40" rx="8"/><rect x="352" y="152" width="52" height="40" rx="8"/><rect x="414" y="152" width="52" height="40" rx="8"/><rect x="476" y="152" width="52" height="40" rx="8"/>
    <rect x="104" y="202" width="52" height="40" rx="8"/><rect x="166" y="202" width="52" height="40" rx="8"/><rect x="228" y="202" width="52" height="40" rx="8"/><rect x="290" y="202" width="52" height="40" rx="8"/><rect x="352" y="202" width="52" height="40" rx="8"/><rect x="414" y="202" width="52" height="40" rx="8"/><rect x="476" y="202" width="52" height="40" rx="8"/>
    <rect x="104" y="252" width="52" height="40" rx="8"/><rect x="166" y="252" width="52" height="40" rx="8"/><rect x="228" y="252" width="52" height="40" rx="8"/><rect x="290" y="252" width="52" height="40" rx="8"/><rect x="352" y="252" width="52" height="40" rx="8"/><rect x="414" y="252" width="52" height="40" rx="8"/><rect x="476" y="252" width="52" height="40" rx="8"/>
    <rect x="104" y="302" width="52" height="40" rx="8"/><rect x="166" y="302" width="52" height="40" rx="8"/><rect x="228" y="302" width="52" height="40" rx="8"/><rect x="290" y="302" width="52" height="40" rx="8"/><rect x="352" y="302" width="52" height="40" rx="8"/><rect x="414" y="302" width="52" height="40" rx="8"/><rect x="476" y="302" width="52" height="40" rx="8"/>
  </g>

  <!-- Selected day + busy-day markers -->
  <rect x="228" y="202" width="52" height="40" rx="8" fill="#8a5e73"/>
  <circle cx="192" cy="182" r="3" fill="#d8a8c0"/>
  <circle cx="316" cy="232" r="3" fill="#d8a8c0"/>
  <circle cx="440" cy="182" r="3" fill="#a7c8e0"/>
  <circle cx="254" cy="282" r="3" fill="#a7c8e0"/>
  <circle cx="502" cy="332" r="3" fill="#d8a8c0"/>

  <!-- Bottom summary strip -->
  <rect x="104" y="354" width="424" height="34" rx="10" fill="#dcefe4"/>
  <rect x="118" y="364" width="140" height="9" rx="4.5" fill="#ffffff" opacity="0.9"/>
  <rect x="384" y="362" width="94" height="16" rx="8" fill="#8a5e73" opacity="0.85"/>
